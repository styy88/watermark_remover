# 插件唯一标识名（必须与目录名一致）
name: astrbot_plugin_watermark_remover

# 插件展示名（在 WebUI 中显示）
display_name: 水印去除助手

# 插件版本
version: 1.0.0

# 插件作者
author: AstrBot Community

# 插件简要描述
